name: Package Chrome Extension

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build extension zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' src/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read version from src/manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=cove-downloader-helper-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          chmod +x ./build.sh
          ./build.sh --force
          test -f "builds/${{ steps.version.outputs.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cove-downloader-helper-${{ steps.version.outputs.version }}
          path: builds/${{ steps.version.outputs.artifact }}
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/${{ steps.version.outputs.artifact }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
