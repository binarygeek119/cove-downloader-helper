name: Package Chrome Extension

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build extension zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' src/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read version from src/manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact=cove-downloader-helper-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          chmod +x ./build.sh
          ./build.sh --force
          test -f "builds/${{ steps.version.outputs.artifact }}"
          ls -la "builds/${{ steps.version.outputs.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cove-downloader-helper-${{ steps.version.outputs.version }}
          path: builds/${{ steps.version.outputs.artifact }}
          if-no-files-found: error

      # Push to master/main or manual run: create/update release v{manifest version}
      - name: Publish GitHub Release (push)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cove Downloader Helper ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: builds/${{ steps.version.outputs.artifact }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Annotated version tags (v*): attach zip to that tag's release
      - name: Publish GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/${{ steps.version.outputs.artifact }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
