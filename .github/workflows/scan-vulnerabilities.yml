name: Scan for vulnerabilities

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

jobs:
  extension:
    name: Scan extension for vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan extension
        run: node scripts/scan-vulnerabilities.mjs

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
