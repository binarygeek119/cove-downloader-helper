name: Pack Extension & Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-and-release:
    name: Pack Chrome extension and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(jq -r '.version' src/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=cove-downloader-helper-${VERSION}-chrome.zip" >> "$GITHUB_OUTPUT"
          echo "zip_alias=cove-downloader-helper-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Pack extension
        run: |
          chmod +x ./scripts/pack-extension.sh ./build.sh
          ./scripts/pack-extension.sh --force
          test -f "builds/${{ steps.meta.outputs.zip }}"
          # Ensure Chrome-loadable layout (manifest at archive root)
          unzip -l "builds/${{ steps.meta.outputs.zip }}" | grep -E '^\s+[0-9]+.+\smanifest\.json$'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cove-downloader-helper-${{ steps.meta.outputs.version }}-packed
          path: |
            builds/${{ steps.meta.outputs.zip }}
            builds/${{ steps.meta.outputs.zip_alias }}
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Cove Downloader Helper ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Packed Chrome extension (Manifest V3).

            Download `${{ steps.meta.outputs.zip }}`, then in Chrome:
            1. Open `chrome://extensions`
            2. Enable Developer mode
            3. Drag the zip onto the page, or unpack and **Load unpacked**

            Version `${{ steps.meta.outputs.version }}` from `src/manifest.json` @ `${{ github.sha }}`.
          files: |
            builds/${{ steps.meta.outputs.zip }}
            builds/${{ steps.meta.outputs.zip_alias }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
