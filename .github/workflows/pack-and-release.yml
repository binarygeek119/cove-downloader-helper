name: Pack Extension & Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: Publish a newer package to the Chrome Web Store
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  pack-and-release:
    name: Pack Chrome extension and publish release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=cove-downloader-helper-${VERSION}-chrome.zip" >> "$GITHUB_OUTPUT"

      - name: Build and pack
        run: |
          npm run build
          chmod +x ./scripts/pack-extension.sh
          ./scripts/pack-extension.sh --force
          test -f "builds/${{ steps.meta.outputs.zip }}"
          # Chrome needs the manifest at the archive root.
          unzip -l "builds/${{ steps.meta.outputs.zip }}" | grep -E '^\s+[0-9]+.+\smanifest\.json$'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cove-downloader-helper-${{ steps.meta.outputs.version }}-packed
          path: builds/${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Cove Downloader Helper ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Packed Chrome extension (Manifest V3).

            Unzip `${{ steps.meta.outputs.zip }}`, then in Chrome:
            1. Open `chrome://extensions`
            2. Enable Developer mode
            3. Choose **Load unpacked** and select the unzipped folder

            Version `${{ steps.meta.outputs.version }}` from `package.json` @ `${{ github.sha }}`.
          files: builds/${{ steps.meta.outputs.zip }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chrome-web-store:
    name: Update Chrome Web Store
    needs: pack-and-release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_to_store
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check store credentials
        id: creds
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          missing=0
          for name in \
            CHROME_WEBSTORE_CLIENT_ID \
            CHROME_WEBSTORE_CLIENT_SECRET \
            CHROME_WEBSTORE_REFRESH_TOKEN \
            CHROME_PUBLISHER_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "missing secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chrome Web Store secrets are not set. Skipping store update."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Download packed extension
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cove-downloader-helper-${{ needs.pack-and-release.outputs.version }}-packed
          path: builds

      - name: Publish newer version
        if: steps.creds.outputs.ready == 'true'
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          chmod +x ./scripts/publish-chrome-webstore.sh
          ./scripts/publish-chrome-webstore.sh "builds/cove-downloader-helper-${{ needs.pack-and-release.outputs.version }}-chrome.zip"
