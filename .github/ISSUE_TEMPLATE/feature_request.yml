name: Feature request
description: Suggest an improvement for Cove Downloader Helper
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for the **browser extension** (toolbar, context menu, in-page buttons, match/override UI, job queue in the helper, settings).
        Cove core or downloader features should go to [yourcove/cove](https://github.com/yourcove/cove/issues).
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is awkward or missing today?
      placeholder: I want to queue a list of URLs from the helper without using Cove’s Download From File screen…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work in the extension?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you’ve thought about, or workarounds you use now.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Download / match / type override
        - Job queue UI
        - Settings
        - In-page buttons
        - Context menu / toolbar
        - Packaging / CI / docs
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Mockups, URLs, related issues, or Cove API details.
    validations:
      required: false
